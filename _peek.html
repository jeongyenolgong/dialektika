<!doctype html><html><head><meta charset="utf-8"><title>장부 엿보기</title></head><body>
<pre id="o">…</pre>
<script src="mqtt.min.js"></script>
<script>
const ROOM = new URLSearchParams(location.search).get("room") || "nolgong";
const c = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {clientId:"peek_"+Math.random().toString(16).slice(2,10)});
let got = null, says = [];
c.on("connect", () => c.subscribe([`dialektika/${ROOM}/book`,`dialektika/${ROOM}/say`]));
c.on("message", (t,b) => { if(t.endsWith("/book")) got = b.toString(); else says.push(b.toString()); });
setTimeout(() => {
  const out = got ? JSON.parse(got) : null;
  const line = `[${ROOM}] ` + (!out ? "장부 없음"
    : `press=${out.press} · 사람 ${(out.players||[]).length}명 · ${JSON.stringify((out.players||[]).map(p=>({n:p.name||"(무명)",t:p.type,got:p.got||0,sent:p.sent||0})))}`)
    + " ⏎ 오간 말 " + says.length + "건: " + says.slice(-4).join(" / ");
  document.getElementById("o").textContent = line;
  fetch("http://localhost:8000/book", {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({report: line})});
}, 12000);
</script></body></html>
