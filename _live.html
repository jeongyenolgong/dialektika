<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>라이브 검사판</title></head><body>
<pre id="log">…</pre><div id="f"></div>
<script src="mqtt.min.js"></script>
<script>
const RM = new URLSearchParams(location.search).get("room") || "live1";
const add = (id, src, w, h) => { const e = document.createElement("iframe");
  e.id = id; e.src = src; e.width = w; e.height = h; document.getElementById("f").appendChild(e); };
add("host", `host.html?n=0&room=${RM}`, 900, 420);
add("scr",  `screen-01-entry.html?room=${RM}`, 900, 420);
add("ph",   `p1-identity.html?room=${RM}`, 390, 780);
const log=[], win=i=>document.getElementById(i).contentWindow, doc=i=>win(i).document;
const at=i=>win(i).location.pathname.split("/").pop();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(f,ms)=>{const e=Date.now()+ms;while(Date.now()<e){try{if(f())return true}catch(x){}await wait(250)}return false};
const type=(w,el,v)=>{el.value=v; el.dispatchEvent(new (w.Event)("input",{bubbles:true}));};
const step=async()=>{doc("host").getElementById("next").click();await wait(200);
                     doc("host").getElementById("go").click();await wait(1500);};
const NAME="이라이브";
const done = t => { document.getElementById("log").textContent = t;
  const c = mqtt.connect("wss://broker.emqx.io:8084/mqtt",{clientId:"rep_"+Math.random().toString(16).slice(2,9)});
  c.on("connect",()=>c.publish(`dialektika/${RM}/report`, t, {retain:true, qos:1})); };
(async () => {
  localStorage.removeItem("dlk.pairs"); localStorage.removeItem("dlk.me");
  await wait(9000);
  log.push(`길 — 진행자 ${win("host").Bus.mode()} · 스크린 ${win("scr").Bus.mode()} · 폰 ${win("ph").Bus.mode()}`);
  const ok1 = await until(()=>doc("ph").getElementById("next").style.visibility==="visible", 30000);
  log.push(`① 유형 배정: ${ok1?"됨":"안 됨"} · 장부 ${win("host").Bus.players().length}명`);
  doc("ph").getElementById("next").click();
  await until(()=>at("ph")==="p2-name.html", 8000);
  await wait(1500);
  type(win("ph"), doc("ph").getElementById("hidden"), NAME);
  await wait(400); doc("ph").getElementById("enter").click();
  await until(()=>at("ph")==="p3-wait.html", 8000);
  await until(()=>win("host").Bus.players().some(p=>p.name===NAME), 12000);
  const inScr = [...doc("scr").querySelectorAll(".col li")].map(e=>e.textContent);
  log.push(`② 이름: 진행자 ${JSON.stringify(win("host").Bus.players().map(p=>p.name))} · 스크린 ${JSON.stringify(inScr)}`);
  await step();
  await until(()=>at("ph")==="p4p5-collect.html", 12000);
  const CODES=[["1","3","4"],["3","0","4"]], OPP=["곁눈질","안주"];
  for(let i=0;i<2;i++){ const w=win("ph"); CODES[i].forEach(k=>w.press(k)); w.press("ENT");
    await wait(1600); type(w, doc("ph").getElementById("hidden"), OPP[i]);
    await wait(400); doc("ph").getElementById("ent").click(); await wait(1800); }
  await until(()=>(win("host").Bus.mine()||{}).got===2, 15000);
  log.push(`③ 수집: 장부 ${(win("host").Bus.mine()||{}).got}쌍 · 단어 ${JSON.stringify(Object.keys(win("host").Bus.state().words||{}))}`);
  await step(); await step();
  await until(()=>at("ph")==="p6-create.html", 12000);
  await wait(2000);
  const pr = JSON.parse(localStorage.getItem("dlk.pairs")||"[]");
  const t = `${pr[0].w}가 깊어지면 ${pr[0].m}은 사라진다`;
  type(win("ph"), doc("ph").getElementById("hidden"), t);
  await wait(500); doc("ph").getElementById("ent").click();
  await until(()=>(win("host").Bus.mine()||{}).sent===1, 15000);
  const st = win("host").Bus.state();
  log.push(`④ 창작: 내 문장 ${(win("host").Bus.mine()||{}).sent}편 · 장부의 문장 ${JSON.stringify((st.sentences||[]).map(s=>s.text))}`);
  done(log.join("\n"));
})().catch(e => done("터짐: "+e.message+"\n"+log.join("\n")));
</script></body></html>
